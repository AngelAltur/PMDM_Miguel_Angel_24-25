name: safe_bite
description: "Mi app para alergias."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_sign_in:  ^6.1.0
  firebase_core:    ^3.10.0
  firebase_auth:    ^5.3.4
  cloud_firestore:  ^5.6.0
  firebase_storage: ^12.3.7
  mobile_scanner:   ^3.0.0
  barcode_scan2:    ^4.5.1
  http:             ^0.13.6
  intl: ^0.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.2.7

flutter:
  uses-material-design: true
  assets:
    - lib/assets/g-logo.png
    - lib/assets/app_icon.png

flutter_icons:
  android: true
  image_path: "lib/assets/app_icon.png"

flutter_native_splash:
  color: "#00C853"        # el verde 
  image: assets/icon/app_icon.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
